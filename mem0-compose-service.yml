  mem0:
    image: mem0-server:local
    container_name: mem0
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./mem0.env
    environment:
      - QDRANT_URL=http://38.9.96.179:6333
      - QDRANT_COLLECTION=mem0
      - EMBEDDER=fastembed
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - LLM_PROVIDER=anthropic
      - LLM_MODEL=claude-sonnet-4-6
    volumes:
      - ./mem0-history:/app/history
