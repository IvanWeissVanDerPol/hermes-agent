name: messaging-platform
label: Messaging
kind: platform
version: 1.0.0
description: >
  Messaging gateway adapter for Hermes Agent.
  Connects to Messaging via a local Node.js bridge (Messaging Web client) over
  an HTTP API and relays messages between Messaging chats and the Hermes agent.
  Supports DM/group policies, mention gating, free-response chats, and
  per-user allowlists.
author: NousResearch
requires_env:
  - name: MESSAGING_ENABLED
    description: "Enable the Messaging adapter (requires the Node.js bridge running)"
    prompt: "Enable Messaging? (true/false)"
    password: false
optional_env:
  - name: MESSAGING_ALLOWED_USERS
    description: "Comma-separated Messaging user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: MESSAGING_ALLOW_ALL_USERS
    description: "Allow any Messaging user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: MESSAGING_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: MESSAGING_HOME_CHANNEL_NAME
    description: "Display name for the Messaging home channel"
    prompt: "Home channel display name"
    password: false
